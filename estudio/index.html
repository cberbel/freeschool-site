<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Estúdio — Free School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Inter:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* Estúdio da Free School — só peças da Free School (tabelas fs_*). O Estúdio da
   Escola Montessoriana mora em sistema.escolamontessoriana.com.br/estudio.html.
   Cores e tipo do sistema v2 da marca: papel, tinta, azul/amarelo/vermelho, Poppins + Inter. */
:root{--tinta:#0D0D0F;--papel:#FFFFFF;--fundo:#F1F1F3;--azul:#0038E0;--amarelo:#F8E800;
      --vermelho:#F80000;--cinza:#6E6E73;--linha:#DCDCE1;--ok:#1d6b3f;--erro:#b3261e}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 'Inter',system-ui,sans-serif;background:var(--fundo);color:var(--tinta);padding-bottom:80px}
header{background:var(--papel);border-bottom:1px solid var(--linha);padding:10px 16px;display:flex;
       justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header button{background:none;border:1px solid var(--linha);color:var(--cinza);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
.logo{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--tinta)}
.stack{display:flex;flex-direction:column;align-items:center;gap:2px}
.sq{display:block;border-radius:2px}
.sq-r{width:7px;height:7px;background:var(--vermelho)}
.sq-y{width:13px;height:13px;background:var(--amarelo)}
.sq-b{width:21px;height:21px;background:var(--azul)}
.word{display:flex;flex-direction:column;line-height:.9;font-family:'Poppins',sans-serif}
.word b{font-weight:700;font-size:17px;letter-spacing:-.02em}
.word i{font-style:normal;font-weight:300;font-size:16px}
.est{font-family:'Poppins',sans-serif;font-weight:600;font-size:14px;color:var(--cinza);margin-left:12px;padding-left:12px;border-left:1px solid var(--linha)}
main{max-width:720px;margin:0 auto;padding:14px}
.abas{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.abas button{flex:1;min-width:0;padding:10px;border:1px solid var(--linha);background:#fff;
     border-radius:10px;font-weight:700;color:var(--cinza);font-size:14px;font-family:inherit}
.abas button.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.card{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:14px;margin-bottom:14px}
.topo{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.tit{font-family:'Poppins',sans-serif;font-weight:700;font-size:17px;line-height:1.2}
.tipo{font-size:12px;color:var(--cinza);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.chip{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.chip.rascunho{background:#fff7b0;color:#6b5a00}
.chip.aprovado{background:#e0f2e9;color:var(--ok)}
.chip.publicado{background:#e3e9ff;color:var(--azul)}
.chip.reprovado,.chip.descartado{background:#fde5e3;color:var(--erro)}
.chip.a.corrigir{background:#ffe9d6;color:#8a4b00}
.lingua{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--azul);color:#fff;margin-left:6px;vertical-align:middle}
.midias{display:flex;gap:8px;overflow-x:auto;margin:10px 0;scroll-snap-type:x mandatory;padding-bottom:6px}
.midias img,.midias video{height:340px;border-radius:8px;scroll-snap-align:start;flex-shrink:0;background:#e6e6ea;cursor:zoom-in}
.contagem{font-size:12px;color:var(--cinza);margin-top:-4px}
.leg{font-size:13px;color:#3F3F46;white-space:pre-wrap;max-height:74px;overflow:hidden;cursor:pointer;margin-top:6px}
.leg.aberta{max-height:none}
.acoes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acoes button{flex:1;min-width:100px;padding:11px 8px;border-radius:10px;border:none;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer}
.b-ap{background:var(--ok);color:#fff}
.b-re{background:#fff;border:1.5px solid var(--erro)!important;color:var(--erro)}
.b-h{background:#fff;border:1.5px solid var(--linha)!important;color:var(--cinza)}
.coment{margin-top:10px;display:flex;gap:8px}
.coment input{flex:1;padding:10px;border:1px solid var(--linha);border-radius:10px;font-size:14px;font-family:inherit}
.coment button{background:var(--azul);color:#fff;border:none;border-radius:10px;padding:0 16px;font-weight:700;font-family:inherit;cursor:pointer}
.hist{font-size:12px;color:var(--cinza);margin-top:8px;border-left:3px solid var(--amarelo);padding-left:8px;white-space:pre-wrap}
.aviso{background:#fffbe0;border:1px solid #efe58a;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#5c4d00;margin-bottom:12px}
.vazio{color:var(--cinza);text-align:center;padding:30px 10px;font-size:14px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filtros button{padding:7px 12px;border:1px solid var(--linha);background:#fff;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--cinza);cursor:pointer;font-family:inherit}
.filtros button.on{background:var(--azul);border-color:var(--azul);color:#fff}
.gimg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.gimg .it{background:var(--papel);border:1px solid var(--linha);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.gimg .it.decidida{opacity:.6}
.gimg .it img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#eef1f5;cursor:zoom-in}
.gimg .txt{padding:8px 10px 6px;display:flex;flex-direction:column;gap:5px;flex:1}
.gimg h4{font-size:12.5px;line-height:1.3;font-weight:700}
.gimg .jus{font-size:11px;color:var(--cinza);line-height:1.35;max-height:44px;overflow:hidden;cursor:pointer}
.gimg .jus.aberta{max-height:none}
.gimg .bts{display:flex;gap:6px;padding:0 10px 10px}
.gimg .bts button{flex:1;padding:9px 4px;border-radius:8px;border:none;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
#login{max-width:380px;margin:80px auto;background:#fff;padding:26px;border-radius:16px;border:1px solid var(--linha)}
#login h1{font-family:'Poppins',sans-serif;font-size:20px;margin:14px 0 4px}
#login p{font-size:13px;color:var(--cinza);margin-bottom:16px}
#login input{width:100%;padding:12px;margin-bottom:10px;border:1px solid var(--linha);border-radius:10px;font-size:15px;font-family:inherit}
#login button{width:100%;padding:13px;background:var(--azul);color:#fff;border:none;border-radius:10px;font-weight:800;font-size:15px;font-family:inherit;cursor:pointer}
#msg{color:var(--erro);font-size:13px;margin-top:8px;min-height:18px}
.regras textarea{width:100%;min-height:90px;padding:12px;border:1px solid var(--linha);border-radius:10px;font-size:14px;margin-bottom:8px;font-family:inherit}
.regras .add{width:100%;padding:12px;background:var(--amarelo);color:var(--tinta);border:none;border-radius:10px;font-weight:800;font-size:15px;font-family:inherit;cursor:pointer}
.regra-item{background:#fff;border:1px solid var(--linha);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}
.regra-item .st{font-size:11px;font-weight:800;color:var(--cinza)}
#lupa{position:fixed;inset:0;background:rgba(13,13,15,.92);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
#lupa img{max-width:96vw;max-height:94vh;border-radius:6px}
@media(max-width:430px){.abas{gap:5px}.abas button{padding:8px 3px;font-size:12px}.midias img{height:300px}}
</style>
</head>
<body>
<div id="app-login">
  <div id="login">
    <span class="logo"><span class="stack"><span class="sq sq-r"></span><span class="sq sq-y"></span><span class="sq sq-b"></span></span><span class="word"><b>free</b><i>school</i></span></span>
    <h1>Estúdio</h1>
    <p>Peças da Free School para aprovação. Mesmo login do Estúdio da escola.</p>
    <input id="em" type="email" placeholder="E-mail" autocomplete="username">
    <input id="se" type="password" placeholder="Senha" autocomplete="current-password">
    <button onclick="entrar()">Entrar</button>
    <div id="msg"></div>
  </div>
</div>

<div id="app" style="display:none">
<header>
  <span style="display:flex;align-items:center">
    <span class="logo"><span class="stack"><span class="sq sq-r"></span><span class="sq sq-y"></span><span class="sq sq-b"></span></span><span class="word"><b>free</b><i>school</i></span></span>
    <span class="est">Estúdio</span>
  </span>
  <button onclick="sair()">Sair</button>
</header>
<main>
  <div class="abas">
    <button id="aba-fila" class="on" onclick="mudarAba('fila')">Fila</button>
    <button id="aba-imgs" onclick="mudarAba('imgs')">Imagens</button>
    <button id="aba-hist" onclick="mudarAba('hist')">Histórico</button>
    <button id="aba-regras" onclick="mudarAba('regras')">Regras</button>
  </div>
  <div id="conteudo"><div class="vazio">Carregando…</div></div>
</main>
</div>
<div id="lupa" onclick="this.style.display='none'"><img alt=""></div>

<script>
const SB_URL = 'https://rmpnqrvsmxhnrwlgqmdp.supabase.co';
const SB_KEY = 'sb_publishable_bg4n-MXnoYVWomRN90WTOg_HOdq3_9G';
const BUCKET = 'fila-previews';          // mídias da Free School ficam em fila-previews/freeschool/...
const db = supabase.createClient(SB_URL, SB_KEY);
let abaAtual = 'fila';
let histFiltro = 'todas';
let imgStatus = 'proposta';
const urlCache = {};
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

async function init(){
  const {data:{session}} = await db.auth.getSession();
  if(session){ mostrarApp(); }
}
async function entrar(){
  document.getElementById('msg').textContent = '';
  const {error} = await db.auth.signInWithPassword({
    email: document.getElementById('em').value.trim(),
    password: document.getElementById('se').value});
  if(error){ document.getElementById('msg').textContent = 'Login inválido: ' + error.message; return; }
  mostrarApp();
}
async function sair(){ await db.auth.signOut(); location.reload(); }
function mostrarApp(){
  document.getElementById('app-login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  carregar();
}
function mudarAba(a){
  abaAtual = a;
  for(const x of ['fila','imgs','hist','regras'])
    document.getElementById('aba-'+x).className = (x===a) ? 'on' : '';
  carregar();
}
async function urlAssinada(path){
  if(!path) return '';
  if(path.startsWith('http')) return path;
  if(urlCache[path]) return urlCache[path];
  const {data} = await db.storage.from(BUCKET).createSignedUrl(path, 3600);
  urlCache[path] = data ? data.signedUrl : '';
  return urlCache[path];
}
function lupa(u){ const l = document.getElementById('lupa'); l.querySelector('img').src = u; l.style.display = 'flex'; }
function fmtData(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const p2 = n => String(n).padStart(2,'0');
  return `${p2(d.getDate())}/${p2(d.getMonth()+1)} ${p2(d.getHours())}h${p2(d.getMinutes())}`;
}

// ---------------------------------------------------------------- Fila / Histórico
async function carregar(){
  const alvo = document.getElementById('conteudo');
  alvo.innerHTML = '<div class="vazio">Carregando…</div>';
  if(abaAtual === 'regras') return carregarRegras();
  if(abaAtual === 'imgs') return carregarImagens();
  const naFila = ['rascunho','a corrigir'];
  let q = db.from('fs_fila').select('*');
  q = (abaAtual === 'fila') ? q.in('status', naFila).order('criado_em')
                            : q.not('status', 'in', '("rascunho","a corrigir")').order('atualizado_em', {ascending:false});
  const {data, error} = await q;
  if(error){ alvo.innerHTML = `<div class="vazio">Erro: ${esc(error.message)}</div>`; return; }
  let lista = data || [];
  alvo.innerHTML = (abaAtual === 'fila')
    ? '<div class="aviso">Só o que espera sua decisão. <b>Aprovar</b> libera a peça para publicar; a publicação da Free School ainda é manual (não há robô ligado ao Instagram da Free School). Comentário e motivo de reprovação voltam para o Claude corrigir.</div>'
    : '';
  if(abaAtual === 'hist'){
    const cont = {};
    for(const p of lista){ cont[p.status] = (cont[p.status]||0)+1; }
    const bt = (v, rot) => `<button data-v="${v}" class="${histFiltro===v?'on':''}">${rot}</button>`;
    alvo.innerHTML += '<div class="filtros" id="f-hist">' + bt('todas', 'Todas (' + lista.length + ')') +
      Object.keys(cont).map(s => bt(s, s + ' (' + cont[s] + ')')).join('') + '</div>';
    document.querySelectorAll('#f-hist button').forEach(b => b.onclick = () => { histFiltro = b.dataset.v; carregar(); });
    if(histFiltro !== 'todas') lista = lista.filter(p => p.status === histFiltro);
  }
  if(!lista.length){ alvo.innerHTML += '<div class="vazio">Nada por aqui.</div>'; return; }
  for(const p of lista){ alvo.appendChild(await cartao(p)); }
}

async function cartao(p){
  const el = document.createElement('div');
  el.className = 'card';
  const coms = (p.comentarios||[]).map(c => `[${(c.em||'').slice(5,16)}] ${c.texto}`).join('\n');
  const n = (p.midias||[]).length;
  el.innerHTML = `
    <div class="topo">
      <div><div class="tit">${esc(p.titulo || p.id)}<span class="lingua">${esc((p.lingua||'pt').toUpperCase())}</span></div>
      <div class="tipo">${esc(p.tipo)}${n ? ` · ${n} lâminas` : ''}${p.quando ? ` · ${fmtData(p.quando)}` : ''}${p.permalink ? ` · <a href="${esc(p.permalink)}" target="_blank">ver post</a>` : ''}</div></div>
      <span class="chip ${esc(p.status)}">${esc(p.status)}</span>
    </div>
    <div class="midias" data-m></div>
    ${n > 1 ? '<div class="contagem">← arraste para ver as lâminas · toque para ampliar</div>' : ''}
    <div class="leg" onclick="this.classList.toggle('aberta')">${esc(p.legenda)}</div>
    ${p.parecer ? `<div class="hist">🧐 ${esc(p.parecer)}</div>` : ''}
    ${p.motivo ? `<div class="hist" style="border-left-color:var(--vermelho)">Motivo: ${esc(p.motivo)}</div>` : ''}
    ${coms ? `<div class="hist">${esc(coms)}</div>` : ''}
    ${['rascunho','a corrigir'].includes(p.status) ? `
    <div class="acoes">
      <button class="b-ap" onclick="decidir('${esc(p.id)}','aprovado')">✓ Aprovar</button>
      <button class="b-re" onclick="reprovar('${esc(p.id)}')">✗ Reprovar</button>
    </div>` : ''}
    ${p.status === 'aprovado' ? `
    <div class="acoes">
      <button class="b-h" onclick="decidir('${esc(p.id)}','publicado')">📣 Marcar como publicado</button>
      <button class="b-re" onclick="decidir('${esc(p.id)}','rascunho')">↩ Voltar para a Fila</button>
    </div>` : ''}
    ${['reprovado','descartado'].includes(p.status) ? `
    <div class="acoes">
      <button class="b-h" onclick="decidir('${esc(p.id)}','rascunho')">↺ Recuperar para a Fila</button>
    </div>` : ''}
    <div class="coment">
      <input placeholder="Comentário para o Claude…" data-c>
      <button onclick="comentar('${esc(p.id)}', this)">Enviar</button>
    </div>`;
  const cont = el.querySelector('[data-m]');
  for(const m of (p.midias||[])){
    const u = await urlAssinada(m.path);
    if(!u) continue;
    if((m.mime||'').startsWith('video')){
      const v = document.createElement('video');
      v.src = u; v.controls = true; v.preload = 'metadata'; cont.appendChild(v);
    } else {
      const i = document.createElement('img');
      i.src = u; i.loading = 'lazy'; i.onclick = () => lupa(u); cont.appendChild(i);
    }
  }
  return el;
}

async function decidir(id, status){
  const campos = {status, atualizado_por:'estudio', atualizado_em:new Date().toISOString()};
  if(status === 'rascunho') campos.motivo = null;
  const {error} = await db.from('fs_fila').update(campos).eq('id', id);
  if(error){ alert('Não deu para salvar: ' + error.message); return; }
  carregar();
}
async function reprovar(id){
  const motivo = prompt('Motivo da reprovação (é o que o Claude vai corrigir):');
  if(motivo === null) return;
  const {error} = await db.from('fs_fila').update({status:'reprovado', motivo,
      atualizado_por:'estudio', atualizado_em:new Date().toISOString()}).eq('id', id);
  if(error){ alert('Não deu para salvar: ' + error.message); return; }
  carregar();
}
async function comentar(id, btn){
  const input = btn.parentElement.querySelector('[data-c]');
  const texto = input.value.trim();
  if(!texto) return;
  const {data} = await db.from('fs_fila').select('comentarios').eq('id', id).single();
  const coms = (data && data.comentarios) || [];
  coms.push({texto, em: new Date().toISOString(), autor:'claudio'});
  const {error} = await db.from('fs_fila').update({comentarios: coms,
      atualizado_em:new Date().toISOString()}).eq('id', id);
  if(error){ alert('Não deu para salvar: ' + error.message); return; }
  input.value = '';
  carregar();
}

// ---------------------------------------------------------------- Imagens
async function carregarImagens(){
  const alvo = document.getElementById('conteudo');
  const {data, error} = await db.from('fs_imagens').select('*').order('criado_em');
  if(error){ alvo.innerHTML = '<div class="vazio">Erro: ' + esc(error.message) + '</div>'; return; }
  const cS = {proposta:0, aprovada:0, rejeitada:0};
  for(const r of data){ cS[r.status] = (cS[r.status]||0)+1; }
  const lista = data.filter(r => imgStatus === 'todas' || r.status === imgStatus);
  const bt = (v, rot) => `<button data-v="${v}" class="${imgStatus===v?'on':''}">${rot}</button>`;
  alvo.innerHTML =
    '<div class="aviso">Imagens geradas para as peças da Free School (com o prompt usado). Aprovar ensina o estilo das próximas; reprovar com motivo evita repetir o erro. <b>' + (cS.proposta||0) + '</b> esperando decisão.</div>' +
    '<div class="filtros" id="f-st">' +
      bt('proposta', 'Para decidir (' + (cS.proposta||0) + ')') +
      bt('aprovada', 'Aprovadas (' + (cS.aprovada||0) + ')') +
      bt('rejeitada', 'Reprovadas (' + (cS.rejeitada||0) + ')') +
      bt('todas', 'Todas (' + data.length + ')') + '</div>' +
    (lista.length ? '<div class="gimg" id="grade"></div>' : '<div class="vazio">Nada com esse filtro.</div>');
  document.querySelectorAll('#f-st button').forEach(b => b.onclick = () => { imgStatus = b.dataset.v; carregarImagens(); });
  const grade = document.getElementById('grade');
  if(!grade) return;
  for(const r of lista){
    const el = document.createElement('div');
    el.className = 'it' + (r.status === 'proposta' ? '' : ' decidida');
    el.innerHTML =
      '<img loading="lazy" alt="' + esc(r.titulo) + '">' +
      '<div class="txt">' +
        '<h4>' + esc(r.titulo || 'sem título') + '</h4>' +
        (r.peca ? '<div class="jus aberta">peça: ' + esc(r.peca) + '</div>' : '') +
        (r.prompt ? '<div class="jus" onclick="this.classList.toggle(\'aberta\')"><b>prompt:</b> ' + esc(r.prompt) + '</div>' : '') +
        (r.motivo ? '<div class="jus aberta"><b>Motivo:</b> ' + esc(r.motivo) + '</div>' : '') +
      '</div>' +
      '<div class="bts">' +
        (r.status === 'proposta'
          ? '<button class="b-ap" data-ok>✓</button><button class="b-re" data-no>✗</button>'
          : '<button class="b-h" data-volta>↩ voltar p/ decidir</button>') +
      '</div>';
    const im = el.querySelector('img');
    urlAssinada(r.url).then(u => { if(u){ im.src = u; im.onclick = () => lupa(u); } });
    const ok = el.querySelector('[data-ok]'), no = el.querySelector('[data-no]'), vo = el.querySelector('[data-volta]');
    if(ok) ok.onclick = () => imgDecidir(r.id, 'aprovada');
    if(no) no.onclick = () => imgDecidir(r.id, 'rejeitada');
    if(vo) vo.onclick = () => imgDecidir(r.id, 'proposta');
    grade.appendChild(el);
  }
}
async function imgDecidir(id, status){
  let motivo;
  if(status === 'rejeitada'){
    motivo = prompt('O que não serviu? (evita repetir o erro na próxima)');
    if(motivo === null) return;
  }
  const campos = {status, atualizado_em: new Date().toISOString()};
  if(status === 'rejeitada') campos.motivo = motivo;
  if(status === 'proposta') campos.motivo = null;
  const {error} = await db.from('fs_imagens').update(campos).eq('id', id);
  if(error){ alert('Não deu para salvar: ' + error.message); return; }
  carregarImagens();
}

// ---------------------------------------------------------------- Regras
async function carregarRegras(){
  const alvo = document.getElementById('conteudo');
  const {data, error} = await db.from('fs_regras').select('*').order('criado_em', {ascending:false});
  if(error){ alvo.innerHTML = `<div class="vazio">Erro: ${esc(error.message)}</div>`; return; }
  alvo.innerHTML = `
    <div class="regras">
      <div class="aviso">Regra da Free School: o que você escrever aqui o Claude incorpora e toda peça futura obedece. Ex.: "nunca fundo preto", "sempre em inglês e português".</div>
      <textarea id="nova-regra" placeholder="Escreva a nova regra ou correção…"></textarea>
      <button class="add" onclick="addRegra()">Adicionar regra</button>
      <div id="lista-regras"></div>
    </div>`;
  const lista = document.getElementById('lista-regras');
  for(const r of (data||[])){
    const d = document.createElement('div');
    d.className = 'regra-item';
    d.innerHTML = `<div class="st">${r.status === 'incorporada' ? '✅ incorporada' : '⏳ aguardando o Claude incorporar'} · ${esc((r.criado_em||'').slice(0,16).replace('T',' '))}</div><div>${esc(r.texto)}</div>`;
    lista.appendChild(d);
  }
}
async function addRegra(){
  const t = document.getElementById('nova-regra').value.trim();
  if(!t) return;
  const {error} = await db.from('fs_regras').insert({texto: t});
  if(error){ alert('Erro: ' + error.message); return; }
  carregarRegras();
}

init();
</script>
</body>
</html>
