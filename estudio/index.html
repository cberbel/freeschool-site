<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Estúdio — Escola Montessoriana</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--azul:#0d2440;--azul2:#1e40af;--dourado:#debb05;--fundo:#f4f6f9;--card:#fff;
      --borda:#e2e8f0;--tinta:#1c2733;--tinta2:#5a6b7d;--ok:#1d6b3f;--erro:#b3261e}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fundo);
     color:var(--tinta);padding-bottom:80px}
header{background:var(--azul);color:#fff;padding:14px 16px;display:flex;
       justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:17px} header .d{color:var(--dourado)}
header button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;
       border-radius:8px;padding:6px 10px;font-size:12px}
main{max-width:680px;margin:0 auto;padding:14px}
.abas{display:flex;gap:8px;margin-bottom:14px}
.abas button{flex:1;padding:10px;border:1px solid var(--borda);background:#fff;
     border-radius:10px;font-weight:700;color:var(--tinta2);font-size:14px}
.abas button.on{background:var(--azul2);border-color:var(--azul2);color:#fff}
.card{background:var(--card);border:1px solid var(--borda);border-radius:14px;
      padding:14px;margin-bottom:14px}
.topo{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.qdo{font-weight:800;font-size:15px}
.chip{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px;text-transform:uppercase}
.chip.rascunho{background:#fff4d6;color:#8a5a00}
.chip.aprovado{background:#e0f2e9;color:var(--ok)}
.chip.publicado{background:#e3e9ff;color:var(--azul2)}
.chip.reprovado{background:#fde5e3;color:var(--erro)}
.tipo{font-size:12px;color:var(--tinta2);text-transform:uppercase;letter-spacing:1px}
.midias{display:flex;gap:8px;overflow-x:auto;margin:10px 0;scroll-snap-type:x mandatory}
.midias img,.midias video{height:280px;border-radius:10px;scroll-snap-align:start;
     flex-shrink:0;background:#dde3ea}
.leg{font-size:13px;color:var(--tinta2);white-space:pre-wrap;max-height:74px;
     overflow:hidden;position:relative;cursor:pointer}
.leg.aberta{max-height:none}
.acoes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acoes button{flex:1;min-width:100px;padding:11px 8px;border-radius:10px;border:none;
      font-weight:800;font-size:14px}
.b-ap{background:var(--ok);color:#fff}
.b-re{background:#fff;border:1.5px solid var(--erro)!important;color:var(--erro)}
.b-h{background:#fff;border:1.5px solid var(--borda)!important;color:var(--tinta2)}
.coment{margin-top:10px;display:flex;gap:8px}
@media(max-width:430px){
  .abas{gap:5px}
  .abas button{padding:10px 4px;font-size:13px;letter-spacing:-.2px}
}
.imgfiltros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.imgfiltros button{padding:7px 12px;border:1px solid var(--borda);background:#fff;
  border-radius:999px;font-size:12.5px;font-weight:700;color:var(--tinta2);cursor:pointer}
.imgfiltros button.on{background:var(--azul2);border-color:var(--azul2);color:#fff}
.gimg{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.gimg .it{background:var(--card);border:1px solid var(--borda);border-radius:12px;
  overflow:hidden;display:flex;flex-direction:column}
.gimg .it.decidida{opacity:.6}
.gimg .it img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;
  background:#eef1f5;cursor:zoom-in}
.gimg .txt{padding:8px 10px 6px;display:flex;flex-direction:column;gap:5px;flex:1}
.gimg h4{font-size:12.5px;line-height:1.3;font-weight:700}
.gimg .jus{font-size:11px;color:var(--tinta2);line-height:1.35}
.gimg .bts{display:flex;gap:6px;padding:0 10px 10px}
.gimg .bts button{flex:1;padding:9px 4px;border-radius:8px;border:none;
  font-size:13px;font-weight:800;cursor:pointer}
.gimg .num{font-size:10.5px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.orig{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;
  padding:2px 7px;border-radius:999px;align-self:flex-start}
.o-aspiracional{background:#f3e2e6;color:#a34e63}
.o-site{background:#e5ede2;color:#4a6b46}
.o-rosto-teste{background:#fde5e3;color:var(--erro)}
.coment input{flex:1;padding:10px;border:1px solid var(--borda);border-radius:10px;font-size:14px}
.coment button{background:var(--azul2);color:#fff;border:none;border-radius:10px;padding:0 16px;font-weight:700}
.hist{font-size:12px;color:var(--tinta2);margin-top:8px;border-left:3px solid var(--dourado);
      padding-left:8px;white-space:pre-wrap}
#login{max-width:360px;margin:80px auto;background:#fff;padding:26px;border-radius:16px;
       border:1px solid var(--borda)}
#login h1{font-size:20px;color:var(--azul);margin-bottom:4px}
#login p{font-size:13px;color:var(--tinta2);margin-bottom:16px}
#login input{width:100%;padding:12px;margin-bottom:10px;border:1px solid var(--borda);
       border-radius:10px;font-size:15px}
#login button{width:100%;padding:13px;background:var(--azul2);color:#fff;border:none;
       border-radius:10px;font-weight:800;font-size:15px}
#msg{color:var(--erro);font-size:13px;margin-top:8px;min-height:18px}
.regras textarea{width:100%;min-height:90px;padding:12px;border:1px solid var(--borda);
       border-radius:10px;font-size:14px;margin-bottom:8px}
.regras .add{width:100%;padding:12px;background:var(--dourado);color:var(--azul);
       border:none;border-radius:10px;font-weight:800;font-size:15px}
.regra-item{background:#fff;border:1px solid var(--borda);border-radius:10px;
       padding:10px 12px;margin-top:10px;font-size:13px}
.regra-item .st{font-size:11px;font-weight:800;color:var(--tinta2)}
.vazio{color:var(--tinta2);text-align:center;padding:30px 10px;font-size:14px}
.aviso{background:#fff8e6;border:1px solid #f0dfae;border-radius:10px;padding:10px 12px;
       font-size:12px;color:#7a5b00;margin-bottom:12px}
</style>
</head>
<body>
<div id="app-login">
  <div id="login">
    <h1>Estúdio <span style="color:var(--dourado)">·</span> Escola Montessoriana</h1>
    <p>Fila de publicação, aprovação e regras.</p>
    <input id="em" type="email" placeholder="E-mail" autocomplete="username">
    <input id="se" type="password" placeholder="Senha" autocomplete="current-password">
    <button onclick="entrar()">Entrar</button>
    <div id="msg"></div>
  </div>
</div>

<div id="app" style="display:none">
<header>
  <b>Estúdio <span class="d">·</span> Montessoriana</b>
  <button onclick="sair()">Sair</button>
</header>
<main>
  <div class="abas">
    <button id="aba-fila" class="on" onclick="mudarAba('fila')">Fila</button>
    <button id="aba-pauta" onclick="mudarAba('pauta')">Pauta</button>
    <button id="aba-imgs" onclick="mudarAba('imgs')">Imagens</button>
    <button id="aba-hist" onclick="mudarAba('hist')">Histórico</button>
    <button id="aba-regras" onclick="mudarAba('regras')">Regras</button>
  </div>
  <div id="conteudo"><div class="vazio">Carregando…</div></div>
</main>
</div>

<script>
const SB_URL = 'https://rmpnqrvsmxhnrwlgqmdp.supabase.co';
const SB_KEY = 'sb_publishable_bg4n-MXnoYVWomRN90WTOg_HOdq3_9G';
const db = supabase.createClient(SB_URL, SB_KEY);
let abaAtual = 'fila';
const urlCache = {};

async function init(){
  const {data:{session}} = await db.auth.getSession();
  if(session){ mostrarApp(); }
}
async function entrar(){
  document.getElementById('msg').textContent = '';
  const {error} = await db.auth.signInWithPassword({
    email: document.getElementById('em').value.trim(),
    password: document.getElementById('se').value});
  if(error){ document.getElementById('msg').textContent = 'Login inválido: ' + error.message; return; }
  mostrarApp();
}
async function sair(){ await db.auth.signOut(); location.reload(); }
function mostrarApp(){
  document.getElementById('app-login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  carregar();
}
function mudarAba(a){
  abaAtual = a;
  for(const x of ['fila','pauta','imgs','hist','regras'])
    document.getElementById('aba-'+x).className = (x===a) ? 'on' : '';
  carregar();
}

async function urlAssinada(path){
  if(urlCache[path]) return urlCache[path];
  const {data} = await db.storage.from('fila-previews').createSignedUrl(path, 3600);
  urlCache[path] = data ? data.signedUrl : '';
  return urlCache[path];
}

function fmtQuando(iso){
  const d = new Date(iso);
  const dias = ['dom','seg','ter','qua','qui','sex','sáb'];
  return `${dias[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')} · ${String(d.getHours()).padStart(2,'0')}h${String(d.getMinutes()).padStart(2,'0')}`;
}

async function carregar(){
  const alvo = document.getElementById('conteudo');
  alvo.innerHTML = '<div class="vazio">Carregando…</div>';
  if(abaAtual === 'regras') return carregarRegras();
  if(abaAtual === 'pauta') return carregarPauta();
  if(abaAtual === 'imgs') return carregarImagens();
  const filtro = (abaAtual === 'fila') ? ['rascunho'] : ['aprovado','publicado','reprovado'];
  const {data, error} = await db.from('pub_fila').select('*')
        .in('status', filtro).order('quando');
  if(error){ alvo.innerHTML = `<div class="vazio">Erro: ${error.message}</div>`; return; }
  if(!data.length){ alvo.innerHTML = '<div class="vazio">Nada por aqui. 🎉</div>'; return; }

  alvo.innerHTML = (abaAtual==='fila')
    ? '<div class="aviso">Só o que espera sua decisão. Aprovou → vai para o Histórico e publica sozinho no horário. A ponte com o robô roda a cada 10 min.</div>' : '';
  for(const p of data){ alvo.appendChild(await cartao(p)); }
}

async function cartao(p){
  const el = document.createElement('div');
  el.className = 'card';
  const coms = (p.comentarios||[]).map(c=>`[${(c.em||'').slice(5,16)}] ${c.texto}`).join('\n');
  el.innerHTML = `
    <div class="topo">
      <div><div class="qdo">${fmtQuando(p.quando)}</div>
      <div class="tipo">${p.tipo}${p.permalink ? ` · <a href="${p.permalink}" target="_blank">ver post</a>`:''}</div></div>
      <span class="chip ${p.status}">${p.status}</span>
    </div>
    <div class="midias" data-m></div>
    <div class="leg" onclick="this.classList.toggle('aberta')">${(p.legenda||'').replace(/</g,'&lt;')}</div>
    ${p.parecer ? `<div class="hist" style="border-left-color:${p.parecer.includes('REPROVAR') ? '#b3261e' : p.parecer.includes('ATENÇÃO') ? '#c77700' : '#1d6b3f'}">🧐 ${p.parecer.replace(/</g,'&lt;')}</div>` : ''}
    ${p.motivo ? `<div class="hist">Motivo: ${p.motivo}</div>` : ''}
    ${coms ? `<div class="hist">${coms.replace(/</g,'&lt;')}</div>` : ''}
    ${p.status==='rascunho' ? `
    <div class="acoes">
      <button class="b-ap" onclick="aprovar('${p.id}')">✓ Aprovar</button>
      <button class="b-re" onclick="reprovar('${p.id}')">✗ Reprovar</button>
      <button class="b-h" onclick="mudarHorario('${p.id}','${p.quando}')">🕒 Horário</button>
    </div>` : ''}
    ${p.status==='aprovado' && !p.permalink ? `
    <div class="acoes">
      <button class="b-re" onclick="cancelarAprovacao('${p.id}')">↩ Cancelar aprovação</button>
      <button class="b-h" onclick="mudarHorario('${p.id}','${p.quando}')">🕒 Horário</button>
    </div>` : ''}
    <div class="coment">
      <input placeholder="Comentário para o Claude (educa o bot)…" data-c>
      <button onclick="comentar('${p.id}', this)">Enviar</button>
    </div>`;
  const cont = el.querySelector('[data-m]');
  for(const m of (p.midias||[])){
    const u = await urlAssinada(m.path);
    if(!u) continue;
    if((m.mime||'').startsWith('video')){
      const v = document.createElement('video');
      v.src = u; v.controls = true; v.preload='metadata'; cont.appendChild(v);
    } else {
      const i = document.createElement('img');
      i.src = u; i.loading='lazy'; cont.appendChild(i);
    }
  }
  return el;
}


// ---------------------------------------------------------------- Imagens
// Banco de stills do Higgsfield (hf_imagens). Ele decide aqui: o que passa
// vira base de reel e ensina o estilo das proximas ondas.
let imgStatus = 'proposta';
let imgOrigem = 'todas';

async function urlImg(u, mini){
  if(!u) return '';
  if(u.startsWith('http')) return (mini && u.endsWith('.png')) ? u.slice(0,-4) + '_min.webp' : u;
  return await urlAssinada(u);   // caminho no bucket
}

async function carregarImagens(){
  const alvo = document.getElementById('conteudo');
  const {data, error} = await db.from('hf_imagens').select('*').order('criado_em');
  if(error){ alvo.innerHTML = '<div class="vazio">Erro: ' + error.message + '</div>'; return; }

  const cS = {proposta:0, aprovada:0, rejeitada:0};
  const cO = {aspiracional:0, site:0, 'rosto-teste':0};
  for(const r of data){ cS[r.status] = (cS[r.status]||0)+1; cO[r.origem] = (cO[r.origem]||0)+1; }

  const lista = data.filter(r =>
    (imgStatus === 'todas' || r.status === imgStatus) &&
    (imgOrigem === 'todas' || r.origem === imgOrigem));

  const bt = (v, atual, rot) =>
    '<button data-v="' + v + '" class="' + (atual === v ? 'on' : '') + '">' + rot + '</button>';

  alvo.innerHTML =
    '<div class="aviso">Banco de imagens do Higgsfield. Aprove o que serve — o aprovado vira base de reel e ensina o estilo das próximas ondas; o reprovado com motivo evita que eu repita o erro. <b>' +
      (cS.proposta||0) + '</b> esperando sua decisão.</div>' +
    '<div class="imgfiltros" id="f-st">' +
      bt('proposta', imgStatus, 'Para decidir (' + (cS.proposta||0) + ')') +
      bt('aprovada', imgStatus, 'Aprovadas (' + (cS.aprovada||0) + ')') +
      bt('rejeitada', imgStatus, 'Reprovadas (' + (cS.rejeitada||0) + ')') +
      bt('todas', imgStatus, 'Todas (' + data.length + ')') +
    '</div>' +
    '<div class="imgfiltros" id="f-or">' +
      bt('todas', imgOrigem, 'Toda origem') +
      bt('aspiracional', imgOrigem, 'Geradas (' + (cO.aspiracional||0) + ')') +
      bt('site', imgOrigem, 'Fotos do site (' + (cO.site||0) + ')') +
      bt('rosto-teste', imgOrigem, 'Teste rostos (' + (cO['rosto-teste']||0) + ')') +
    '</div>' +
    (lista.length ? '<div class="gimg" id="grade"></div>'
                  : '<div class="vazio">Nada com esse filtro. 🎉</div>');

  document.querySelectorAll('#f-st button').forEach(b =>
    b.onclick = () => { imgStatus = b.dataset.v; carregarImagens(); });
  document.querySelectorAll('#f-or button').forEach(b =>
    b.onclick = () => { imgOrigem = b.dataset.v; carregarImagens(); });

  const grade = document.getElementById('grade');
  if(!grade) return;
  let n = 0;
  for(const r of lista){
    n++;
    const el = document.createElement('div');
    el.className = 'it' + (r.status === 'proposta' ? '' : ' decidida');
    const rot = r.origem === 'site' ? 'foto real'
              : r.origem === 'rosto-teste' ? 'teste rosto' : 'gerada';
    el.innerHTML =
      '<img loading="lazy" alt="' + (r.titulo||'') + '">' +
      '<div class="txt">' +
        '<span class="orig o-' + r.origem + '">' + rot + '</span>' +
        '<h4>' + (r.titulo||'sem título').replace(/</g,'&lt;') + '</h4>' +
        (r.justificativa ? '<div class="jus">' + r.justificativa.replace(/</g,'&lt;') + '</div>' : '') +
        (r.motivo ? '<div class="jus"><b>Motivo:</b> ' + r.motivo.replace(/</g,'&lt;') + '</div>' : '') +
      '</div>' +
      '<div class="bts">' +
        (r.status === 'proposta'
          ? '<button class="b-ap" data-ok>✓</button><button class="b-re" data-no>✗</button>'
          : '<button class="b-h" data-volta>↩ voltar p/ decidir</button>') +
      '</div>';
    const im = el.querySelector('img');
    urlImg(r.url, true).then(u => { if(u) im.src = u; });
    im.onclick = async () => { const u = await urlImg(r.url, false); if(u) window.open(u, '_blank'); };
    const ok = el.querySelector('[data-ok]'), no = el.querySelector('[data-no]'),
          vo = el.querySelector('[data-volta]');
    if(ok) ok.onclick = () => imgDecidir(r.id, 'aprovada');
    if(no) no.onclick = () => imgDecidir(r.id, 'rejeitada');
    if(vo) vo.onclick = () => imgDecidir(r.id, 'proposta');
    grade.appendChild(el);
  }
}

async function imgDecidir(id, status){
  let motivo;
  if(status === 'rejeitada'){
    motivo = prompt('O que não serviu? (isso evita que eu repita o erro nas próximas ondas)');
    if(motivo === null) return;
  }
  const campos = {status, atualizado_em: new Date().toISOString()};
  if(status === 'rejeitada') campos.motivo = motivo;
  if(status === 'proposta') campos.motivo = null;
  const {error} = await db.from('hf_imagens').update(campos).eq('id', id);
  if(error){ alert('Não deu para salvar: ' + error.message); return; }
  carregarImagens();
}

async function aprovar(id){
  await db.from('pub_fila').update({status:'aprovado', atualizado_por:'estudio',
      atualizado_em:new Date().toISOString()}).eq('id', id);
  carregar();
}
async function cancelarAprovacao(id){
  await db.from('pub_fila').update({status:'rascunho',
      motivo:'aprovação cancelada pelo Claudio — não auto-aprovar',
      atualizado_por:'estudio', atualizado_em:new Date().toISOString()}).eq('id', id);
  carregar();
}
async function reprovar(id){
  const motivo = prompt('Motivo da reprovação (vira aprendizado do bot):');
  if(motivo === null) return;
  await db.from('pub_fila').update({status:'reprovado', motivo,
      atualizado_por:'estudio', atualizado_em:new Date().toISOString()}).eq('id', id);
  carregar();
}
async function mudarHorario(id, atual){
  const d = new Date(atual);
  const sugestao = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const novo = prompt('Novo horário (AAAA-MM-DD HH:MM):', sugestao);
  if(!novo) return;
  const dt = new Date(novo.replace(' ','T'));
  if(isNaN(dt)){ alert('Formato inválido'); return; }
  await db.from('pub_fila').update({quando: dt.toISOString(),
      atualizado_por:'estudio', atualizado_em:new Date().toISOString()}).eq('id', id);
  carregar();
}
async function comentar(id, btn){
  const input = btn.parentElement.querySelector('[data-c]');
  const texto = input.value.trim();
  if(!texto) return;
  const {data} = await db.from('pub_fila').select('comentarios').eq('id', id).single();
  const coms = (data && data.comentarios) || [];
  coms.push({texto, em: new Date().toISOString()});
  await db.from('pub_fila').update({comentarios: coms}).eq('id', id);
  input.value = '';
  carregar();
}

// ---------- PAUTA (aprovação de intenção + modo de publicação) ----------
const MODOS = {
  manual: 'Manual — você aprova peça a peça na Fila (como hoje).',
  pauta:  'Pauta — você aprova só a pauta da semana; a peça publica sozinha quando as DUAS revisões (mecânica + visual) dão OK.',
  auto:   'Auto — publica sozinha com as duas revisões OK, sem pauta. Você só veta exceções.'
};
async function carregarPauta(){
  const alvo = document.getElementById('conteudo');
  const [{data:cfg}, {data, error}] = await Promise.all([
    db.from('pub_config').select('valor').eq('chave','modo_publicacao').single(),
    db.from('pub_pauta').select('*').order('data').order('slot')
  ]);
  if(error){ alvo.innerHTML = `<div class="vazio">Erro: ${error.message}</div>`; return; }
  const modo = (cfg && cfg.valor) || 'manual';
  let html = `
    <div class="aviso"><b>Modo de publicação:</b><br>` +
    Object.keys(MODOS).map(m =>
      `<label style="display:block;margin:6px 0;cursor:pointer">
         <input type="radio" name="modo" value="${m}" ${m===modo?'checked':''}
                onchange="mudarModo('${m}')"> <b>${m}</b> — ${MODOS[m]}</label>`).join('') +
    `</div>
    <div class="aviso">A pauta é a intenção da semana: aprove/edite ANTES de a peça ser
    produzida. Peça só nasce de pauta aprovada (no modo pauta).</div>`;
  const propostas = (data||[]).filter(p=>p.status==='proposta');
  const nApr = (data||[]).filter(p=>p.status==='aprovada').length;
  const nRej = (data||[]).filter(p=>p.status==='rejeitada').length;
  if(nApr || nRej) html += `<div class="aviso">${nApr} aprovada(s) → na esteira de produção · ${nRej} rejeitada(s) → aprendizado da próxima pauta</div>`;
  if(propostas.length > 1) html += `<button class="add" onclick="pautaAprovarTudo()">✓ Aprovar as ${propostas.length} propostas</button>`;
  alvo.innerHTML = html;
  if(!propostas.length){ alvo.innerHTML += '<div class="vazio">Nenhuma proposta esperando você. 🎉</div>'; return; }
  for(const p of propostas){
    const el = document.createElement('div');
    el.className = 'card';
    const coms = (p.comentarios||[]).map(c=>`[${(c.em||'').slice(5,16)}] ${c.texto}`).join('\n');
    el.innerHTML = `
      <div class="topo">
        <div><div class="qdo">${p.data} · ${p.slot==='card-1130'?'card 11h30':'reel 18h30'}</div>
        <div class="tipo">${p.pilar||''} · ${p.formato||''}</div></div>
        <span class="chip ${p.status==='aprovada'?'aprovado':p.status==='rejeitada'?'reprovado':'rascunho'}">${p.status}</span>
      </div>
      <div class="midias" data-m></div>
      <div class="leg aberta"><b>${(p.gancho||'').replace(/</g,'&lt;')}</b><br>
        ${(p.tema||'').replace(/</g,'&lt;')}
        ${p.foto ? `<br>📷 ${p.foto.replace(/</g,'&lt;')}` : ''}
        ${p.fonte ? `<br>🔬 ${p.fonte.replace(/</g,'&lt;')}` : ''}</div>
      ${p.justificativa ? `<div class="hist">💡 ${p.justificativa.replace(/</g,'&lt;')}</div>` : ''}
      ${p.motivo ? `<div class="hist">Motivo: ${p.motivo.replace(/</g,'&lt;')}</div>` : ''}
      ${coms ? `<div class="hist">${coms.replace(/</g,'&lt;')}</div>` : ''}
      ${p.status==='proposta' ? `
      <div class="acoes">
        <button class="b-ap" onclick="pautaStatus('${p.id}','aprovada')">✓ Aprovar</button>
        <button class="b-re" onclick="pautaRejeitar('${p.id}')">✗ Rejeitar</button>
      </div>` : ''}
      <div class="coment">
        <input placeholder="Comentário / ajuste do tema (educa o bot)…" data-c>
        <button onclick="pautaComentar('${p.id}', this)">Enviar</button>
      </div>`;
    alvo.appendChild(el);
    if(p.foto_bucket){
      const u = await urlAssinada(p.foto_bucket);
      if(u){ const i = document.createElement('img'); i.src = u; i.loading = 'lazy';
             el.querySelector('[data-m]').appendChild(i); }
    }
  }
}
async function mudarModo(m){
  if(!confirm(`Mudar o modo de publicação para "${m}"?\n\n${MODOS[m]}`)){ carregar(); return; }
  const {error} = await db.from('pub_config').update({valor:m,
      atualizado_em:new Date().toISOString()}).eq('chave','modo_publicacao');
  if(error) alert('Erro: '+error.message);
  carregar();
}
async function pautaStatus(id, st){
  await db.from('pub_pauta').update({status:st,
      atualizado_em:new Date().toISOString()}).eq('id', id);
  carregar();
}
async function pautaRejeitar(id){
  const motivo = prompt('Por que rejeitar? (vira aprendizado da próxima pauta)');
  if(motivo === null) return;
  await db.from('pub_pauta').update({status:'rejeitada', motivo,
      atualizado_em:new Date().toISOString()}).eq('id', id);
  carregar();
}
async function pautaAprovarTudo(){
  await db.from('pub_pauta').update({status:'aprovada',
      atualizado_em:new Date().toISOString()}).eq('status','proposta');
  carregar();
}
async function pautaComentar(id, btn){
  const input = btn.parentElement.querySelector('[data-c]');
  const texto = input.value.trim();
  if(!texto) return;
  const {data} = await db.from('pub_pauta').select('comentarios').eq('id', id).single();
  const coms = (data && data.comentarios) || [];
  coms.push({texto, em: new Date().toISOString()});
  await db.from('pub_pauta').update({comentarios: coms}).eq('id', id);
  input.value = '';
  carregar();
}

async function carregarRegras(){
  const alvo = document.getElementById('conteudo');
  const {data, error} = await db.from('pub_regras').select('*')
        .order('criado_em', {ascending:false});
  if(error){ alvo.innerHTML = `<div class="vazio">Erro: ${error.message}</div>`; return; }
  alvo.innerHTML = `
    <div class="regras">
      <div class="aviso">O que você escrever aqui vira regra oficial: o Claude incorpora
      no REGRAS.md e toda peça futura obedece. Ex.: "nunca usar foto sem criança",
      "sábado o post é sempre de atividade externa".</div>
      <textarea id="nova-regra" placeholder="Escreva a nova regra ou correção…"></textarea>
      <button class="add" onclick="addRegra()">Adicionar regra</button>
      <div id="lista-regras"></div>
    </div>`;
  const lista = document.getElementById('lista-regras');
  for(const r of (data||[])){
    const d = document.createElement('div');
    d.className = 'regra-item';
    d.innerHTML = `<div class="st">${r.status === 'incorporada' ? '✅ incorporada ao REGRAS.md' : '⏳ aguardando o Claude incorporar'} · ${(r.criado_em||'').slice(0,16).replace('T',' ')}</div>
                   <div>${(r.texto||'').replace(/</g,'&lt;')}</div>`;
    lista.appendChild(d);
  }
}
async function addRegra(){
  const t = document.getElementById('nova-regra').value.trim();
  if(!t) return;
  const {error} = await db.from('pub_regras').insert({texto: t});
  if(error){ alert('Erro: '+error.message); return; }
  carregarRegras();
}

init();
</script>
